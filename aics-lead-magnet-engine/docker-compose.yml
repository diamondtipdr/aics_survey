name: aics-lead-magnet-engine

services:
  mysql:
    image: mysql:8.0
    container_name: aics-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-aics_leads}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aics-lead-magnet
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-aics_leads}
      GOOGLE_SERVICE_ACCOUNT_KEY_PATH: /app/secrets/google-service-account.json
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      LOG_FILE_PATH: /app/logs/app.log
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
    volumes:
      - app_logs:/app/logs
      - ${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:-./secrets/google-service-account.json}:/app/secrets/google-service-account.json:ro
    depends_on:
      mysql:
        condition: service_healthy
    user: node

volumes:
  mysql_data:
  app_logs: